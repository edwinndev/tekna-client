stages:
  - deploy

deploy_production:
  stage: deploy
  tags:
    - tekna-platform
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
  script:
    - echo "Deploying tekna-client with docker compose on tekna-network..."
    - docker compose down || true
    - docker compose up -d --build
    - docker image prune -f
